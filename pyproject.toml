[project]
name = "Xi_Lusheng"
version = "0.1.0"
description = "Xi_Lusheng"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.4.4,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "nonebot-adapter-console>=0.9.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# 不要在这里放 nb-cli：nb-cli 需要 textual>=5.3，而 nonebot-adapter-console
# 依赖的 nonechat 需要 textual<4，两者无法共存，会导致 `uv sync` 解析失败。
dev = []

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
"@local" = []

[tool.nonebot.plugins]
"@local" = []

[tool.uv]
# 本项目不是可安装的发行包（bot.py 直接运行 + src/plugins），
# 告诉 uv 只同步依赖，不要构建/安装项目本身。
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
